name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse tracked environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.local$)'; then
            echo "Tracked environment files are not allowed"
            exit 1
          fi

  backend-submodule:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: sustainashare_backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - run: pytest -q
        env:
          APP_ENV: development
          SECRET_KEY: ci-test-secret-key-at-least-32-chars
          MONGO_DETAILS: mongodb://127.0.0.1:27017
          CORS_ORIGINS: http://localhost:5173
          TRUSTED_HOSTS: localhost,127.0.0.1,testserver
          COOKIE_SECURE: "false"
        continue-on-error: true
